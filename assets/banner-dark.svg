<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="100%">
  <defs>
    <style>
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes glow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.8; }
      }
    </style>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#fff"/>
      <rect y="2" width="4" height="2" fill="#000"/>
    </pattern>
    <radialGradient id="ambientGlow" cx="85%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleBarGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
  </defs>

  <!-- Terminal window frame -->
  <rect width="899" height="339" x="0.5" y="0.5" rx="8" ry="8" fill="#0D1117" stroke="rgba(48,54,61,0.8)" stroke-width="1"/>
  
  <!-- Title bar -->
  <rect width="899" height="36" x="0.5" y="0.5" rx="8" ry="0" fill="url(#titleBarGrad)" stroke="none"/>
  <rect width="899" height="28" x="0.5" y="8.5" fill="url(#titleBarGrad)" stroke="none"/>
  <line x1="0" y1="36" x2="900" y2="36" stroke="rgba(48,54,61,0.5)" stroke-width="1"/>
  
  <!-- Window controls -->
  <circle cx="22" cy="19" r="5.5" fill="#FF5F56"/>
  <circle cx="42" cy="19" r="5.5" fill="#FFBD2E"/>
  <circle cx="62" cy="19" r="5.5" fill="#27C93F"/>
  
  <!-- Title bar text -->
  <text x="450" y="23" font-family="'Consolas','Monaco','Courier New',monospace" font-size="12" fill="#8B949E" text-anchor="middle">nitin@ai-lab:~</text>

  <!-- Ambient glow effect -->
  <rect width="900" height="340" fill="url(#ambientGlow)" rx="8" ry="8"/>

  <!-- Terminal content -->
  <g font-family="'Consolas','Monaco','Courier New',monospace" font-size="14" transform="translate(28, 62)">
    <!-- whoami -->
    <text y="0" fill="#3FB950">$ whoami</text>
    <text y="22" fill="#C9D1D9" font-size="15" font-weight="600">Nitin Singh</text>
    <text y="22" fill="#C9D1D9" font-size="15" font-weight="600" dx="115"> — </text>
    <text y="22" fill="#58A6FF" font-size="15">AI Systems Engineer</text>
    <text y="22" fill="#58A6FF" font-size="15" dx="252"/>
    
    <!-- mission -->
    <text y="60" fill="#3FB950">$ cat mission.txt</text>
    <text y="82" fill="#8B949E">Building local-first AI infrastructure.</text>
    <text y="104" fill="#8B949E">Your models, your data, your machine.</text>

    <!-- stack -->
    <text y="142" fill="#3FB950">$ stack --list</text>
    <text y="164" fill="#58A6FF">Rust</text>
    <text y="164" fill="#30363D" dx="32"> · </text>
    <text y="164" fill="#58A6FF" dx="49">TypeScript</text>
    <text y="164" fill="#30363D" dx="131"> · </text>
    <text y="164" fill="#58A6FF" dx="148">Python</text>
    <text y="164" fill="#30363D" dx="198"> · </text>
    <text y="164" fill="#58A6FF" dx="215">React</text>
    <text y="164" fill="#30363D" dx="259"> · </text>
    <text y="164" fill="#58A6FF" dx="276">Next.js</text>
    <text y="164" fill="#30363D" dx="332"> · </text>
    <text y="164" fill="#58A6FF" dx="349">Tauri</text>

    <!-- status -->
    <text y="202" fill="#3FB950">$ echo $STATUS</text>
    <text y="224" fill="#F78166">Open to remote AI Engineering internships →</text>

    <!-- blinking cursor -->
    <rect x="0" y="248" width="8" height="16" rx="1" fill="#3FB950" style="animation: blink 1.06s steps(2, start) infinite;"/>
  </g>
  
  <!-- Scanline overlay -->
  <rect width="100%" height="100%" fill="url(#scanlines)" opacity="0.02" rx="8" ry="8" pointer-events="none"/>
</svg>
